name: Build & Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.ref_name }}
          releaseName: 'PSCode ${{ github.ref_name }}'
          releaseBody: 'See the assets below for the installers.'
          releaseDraft: false
          prerelease: false

      - name: Rename installer
        shell: powershell
        run: |
          $file = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Copy-Item $file.FullName "PSCode_Setup.exe"

      - name: Upload PSCode_Setup.exe
        uses: softprops/action-gh-release@v2
        with:
          files: PSCode_Setup.exe
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.ref_name }}
          releaseName: 'PSCode ${{ github.ref_name }} Android'
          releaseBody: 'See the assets below for the Android APK.'
          releaseDraft: false
          prerelease: false
          args: android build

      - name: Find and rename APK
        shell: bash
        run: |
          apk=$(find src-tauri/gen/android -name "*.apk" | head -1)
          if [ -n "$apk" ]; then
            cp "$apk" "PSCode-Android-${{ github.ref_name }}.apk"
          fi

      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        with:
          files: PSCode-Android-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}